<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Capricciosa · Postres artesanales</title>
  <!-- Dirección vieja (product.html?producto=...): lleva a la página nueva del producto en productos/ -->
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("producto");
      location.replace(id && /^[a-z0-9-]+$/.test(id) ? "productos/" + id + ".html" : "index.html#menu");
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=index.html#menu"></noscript>
</head>
<body>
  <p><a href="index.html#menu">Ver el menú de Capricciosa</a></p>
</body>
</html>
