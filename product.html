<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capricciosa · Postres artesanales</title>
  <meta name="description" content="Tortas marquesas, nuvole y tres leches artesanales. Elegí tu postre y pedilo por WhatsApp.">
  <link rel="icon" type="image/jpeg" href="img/CapricciosaMinimalistaLogo.jpg">
  <meta property="og:title" content="Capricciosa · Postres artesanales">
  <meta property="og:description" content="Tortas marquesas, nuvole y tres leches artesanales. Elegí tu postre y pedilo por WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="img/CapricciosaLogoCompleto.jpg">
  <meta name="theme-color" content="#EFC1C7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header" id="cabecera"></header>

  <main>
    <!-- Product hero (rendered by JS) -->
    <section class="product-hero">
      <div class="container" id="product-hero"></div>
    </section>

    <!-- Details -->
    <section class="section cream" id="product-detail">
      <div class="container product-detail">
        <div class="detail-card" id="detail-card"></div>
        <div class="detail-card wa-panel" id="wa-panel"></div>
      </div>
    </section>

    <!-- Related -->
    <section class="section lemon" id="related">
      <div class="container">
        <div class="section-head">
          <span class="section-eyebrow">Seguro que también te gustan</span>
          <h2>Más capriccitos</h2>
        </div>
        <div class="related-grid" id="related-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="contacto"></footer>

  <script src="js/products.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
